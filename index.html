<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>minimi — AI Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600&family=Sora:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --side:#f7f7f7; --ink:#111111; --muted:#6b6b6b; --line:#e4e4e4;
  --soft:#f1f1f1; --btn:#111111; --btn-ink:#ffffff; --hover:#ececec;
  --serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--side:#0d0d0d;--ink:#f2f2f2;--muted:#9a9a9a;--line:#262626;--soft:#1a1a1a;--btn:#f2f2f2;--btn-ink:#000;--hover:#202020}
}
:root[data-theme="dark"]{--bg:#000;--side:#0d0d0d;--ink:#f2f2f2;--muted:#9a9a9a;--line:#262626;--soft:#1a1a1a;--btn:#f2f2f2;--btn-ink:#000;--hover:#202020}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:268px 1fr;height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{font:700 22px 'Sora',var(--sans);text-transform:lowercase;letter-spacing:-.03em;padding:6px 10px 14px}
.brand small{display:block;font:400 13px var(--sans);color:var(--muted)}
.new{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:500;border:1px solid var(--line);background:var(--bg);margin-bottom:12px}
.new:hover,.hist button:hover{background:var(--hover)}
.side h2{font:500 13px var(--sans);color:var(--muted);margin:8px 12px 4px}
.hist{list-style:none;margin:0;padding:0}
.hist button{width:100%;text-align:left;padding:9px 12px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .on{background:var(--hover)}

.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--bg)}
header h1{font:700 18px 'Sora',var(--sans);text-transform:lowercase;letter-spacing:-.03em;margin:0}
.icon{padding:8px;border-radius:10px;display:grid;place-items:center}
.icon:hover{background:var(--hover)}
.feed{overflow:auto;padding:28px 20px}
.thread{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.msg.user{align-self:flex-end;max-width:80%;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.msg.user .text{background:var(--soft);padding:10px 18px;border-radius:22px}
.msg.agent{display:flex;gap:14px}
.avatar{flex:none;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font:700 14px 'Sora',var(--sans);text-transform:lowercase}
.msg.agent .text{padding-top:3px}
.text p{margin:0 0 .7em}.text p:last-child{margin:0}
.files{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.typing{display:inline-flex;gap:5px;padding:10px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}

.intro{text-align:center;padding:12vh 0 0}
.intro h2{font:700 28px/1.3 var(--serif);margin:0 0 10px}
.intro p{color:var(--muted);margin:0 auto;max-width:480px}

.dock{padding:0 20px 18px}
.composer{max-width:760px;margin:0 auto;border:1px solid var(--line);background:var(--bg);border-radius:28px;padding:10px 12px;box-shadow:0 1px 8px rgba(0,0,0,.06);transition:border-color .15s}
.composer.drag{border-color:var(--muted)}
textarea:focus,textarea:focus-visible{outline:none;box-shadow:none}
.row{display:flex;align-items:flex-end;gap:8px}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;padding:8px 4px;max-height:160px;min-height:40px}
.circle{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.attach:hover{background:var(--hover)}
.send{background:var(--btn);color:var(--btn-ink)}
.send:disabled{opacity:.25;cursor:default}
.tray{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px 10px}
.tray:empty{display:none}
.chip{position:relative;display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px;max-width:230px}
.chip img{width:42px;height:42px;object-fit:cover;border-radius:8px}
.chip .ext{width:42px;height:42px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--sans);color:var(--muted)}
.chip b{display:block;font:500 14px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.chip small{color:var(--muted);font-size:12px}
.chip .x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:13px;line-height:1}
.note{text-align:center;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.tools{display:flex;gap:8px;padding:6px 4px 0}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.pill svg{width:16px;height:16px}
.pill:hover{background:var(--hover)}
.pill.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.msg.agent .text{flex:1;min-width:0}
.tools[hidden],.menu[hidden]{display:none}
.menuwrap{position:relative;flex:none}
.menu{position:absolute;bottom:calc(100% + 12px);left:0;min-width:230px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:5}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.menu button:hover{background:var(--hover)}
.attach svg{transition:transform .2s ease}
.attach[aria-expanded="true"] svg{transform:rotate(45deg)}
.imgcard{display:flex;flex-direction:column;gap:10px;width:min(420px,100%)}
.imgbox{width:100%;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--soft)}
.imgbox img{width:100%;height:100%;display:block;object-fit:cover}
.imgbox.load{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.acts{display:flex;gap:8px}
.acts button{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.acts button:hover{background:var(--hover)}
@media (prefers-reduced-motion:reduce){.imgbox.load{animation:none}}

.app{transition:grid-template-columns .3s ease}
.side{min-width:0;overflow-x:hidden;transition:padding .3s ease,border-color .3s ease}
.side>*{min-width:244px}
.app.collapsed{grid-template-columns:0 1fr}
.app.collapsed .side{padding-left:0;padding-right:0;border-right-color:transparent}
.left{display:flex;align-items:center;gap:6px}
.theme-ico{position:relative;width:20px;height:20px;display:block}
.theme-ico svg{position:absolute;inset:0;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .35s ease}
.theme-ico .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
[data-theme="dark"] .theme-ico .sun{opacity:0;transform:rotate(90deg) scale(.4)}
[data-theme="dark"] .theme-ico .moon{opacity:1;transform:none}
.fade,.fade *{transition:background-color .4s ease,color .4s ease,border-color .4s ease !important}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
@media (prefers-reduced-motion:reduce){.app,.side,.theme-ico svg{transition:none}}
@media (max-width:760px){.app,.app.collapsed{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:268px;z-index:10;transform:translateX(-100%);transition:transform .25s ease;padding:16px 12px}.app.mopen .side{transform:none;box-shadow:0 0 30px rgba(0,0,0,.25)}header{padding:10px 16px}.msg.user{max-width:92%}}
.meta{color:var(--muted);font-size:14px}
.text ul,.text ol{margin:0 0 .7em;padding-left:1.4em}
.text code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.92em}
.hist:empty::before{content:'No chats yet';display:block;padding:9px 12px;color:var(--muted);font-size:14px}
.brand small{text-transform:none;letter-spacing:0}
.hist li{position:relative}
.hist li>button:first-child{padding-right:38px}
.hist .del{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;padding:0;text-align:center;display:none;color:var(--muted)}
.hist li:hover .del,.hist li:focus-within .del{display:block}
.text h4{margin:.8em 0 .4em;font-size:1.05em}
.code{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 .9em;background:var(--soft)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.ch .copy{font-size:13px;padding:2px 8px;border-radius:6px}.ch .copy:hover{background:var(--hover)}
.code pre{margin:0;padding:12px 14px;overflow-x:auto}
.code code{font:14px/1.55 Consolas,'SF Mono',Menlo,monospace;background:none;padding:0}
.mact{display:flex;gap:4px;margin-top:6px}
.mact button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.mact button:hover{background:var(--hover);color:var(--ink)}
.mact svg{width:17px;height:17px}
.uact{opacity:0;transition:opacity .15s;justify-content:flex-end;margin-top:2px}
.msg.user:hover .uact,.uact:focus-within{opacity:1}
@media (hover:none){.uact{opacity:1}}
.mic:hover{background:var(--hover)}
.mic[hidden]{display:none}
.mic.rec{background:var(--btn);color:var(--btn-ink);animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Conversations">
    <div class="brand">minimi<small>AI assistant</small></div>
    <button class="new" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <h2>Recent</h2>
    <ul class="hist" id="hist"></ul>
  </nav>

  <div class="main" id="drop">
    <header>
      <div class="left"><button class="icon" id="toggle" aria-label="Show or hide sidebar" aria-expanded="true" title="Toggle sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <h1>minimi</h1></div>
      <button class="icon" id="theme" aria-label="Switch light or dark theme"><span class="theme-ico"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button>
    </header>

    <div class="feed" id="feed"><div class="thread" id="thread"></div></div>

    <div class="dock">
      <div class="composer" id="composer">
        <div class="tray" id="tray"></div>
        <div class="row">
          <div class="menuwrap"><button class="circle attach" id="attach" aria-label="Add" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <div class="menu" id="menu" hidden>
              <button id="m-files"><svg viewBox="0 0 24 24"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/></svg>Add photos &amp; files</button>
              <button id="m-img"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg>Create image</button>
            </div></div>
          <input type="file" id="file" multiple accept="image/*,.pdf,.docx,.txt,.csv,.md,.json" hidden>
          <textarea id="input" rows="1" placeholder="Message minimi" aria-label="Message"></textarea>
          <button class="circle mic" id="mic" aria-label="Voice input" title="Voice input"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg></button>
          <button class="circle send" id="send" aria-label="Send message" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
        <div class="tools" id="tools" hidden><button class="pill" id="imgmode" aria-pressed="false" aria-label="Turn off image creation"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg>Create image <span aria-hidden="true">×</span></button></div>
      </div>
      <p class="note">minimi can make mistakes. Please verify important information.</p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const thread=$('thread'), feed=$('feed'), input=$('input'), sendBtn=$('send'), tray=$('tray'), fileIn=$('file');
let files=[], busy=false;
const ICON = {
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  speak:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  stop:'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const size = b => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';

function chip(f, removable, i){
  const isImg = f.type.startsWith('image/');
  const ext = (f.name.split('.').pop()||'file').slice(0,4).toUpperCase();
  return `<div class="chip">${isImg ? `<img src="${f.url}" alt="">` : `<div class="ext">${esc(ext)}</div>`}
    <div><b title="${esc(f.name)}">${esc(f.name)}</b><small>${size(f.size)}</small></div>
    ${removable ? `<button class="x" data-i="${i}" aria-label="Remove ${esc(f.name)}">×</button>` : ''}</div>`;
}
function renderTray(){
  tray.innerHTML = files.map((f,i)=>chip(f,true,i)).join('');
  tray.querySelectorAll('.x').forEach(b => b.onclick = () => { files.splice(+b.dataset.i,1); renderTray(); sync(); });
}
function addFiles(list){
  [...list].forEach(f => files.push({name:f.name,type:f.type||'',size:f.size,url:f.type.startsWith('image/')?URL.createObjectURL(f):'',file:f}));
  renderTray(); sync();
}
function sync(){ sendBtn.disabled = busy || (!input.value.trim() && !files.length); }

function intro(){
  thread.innerHTML = `<div class="intro"><h2>How can I help you today?</h2>
  <p>Ask a question, or attach photos and documents and I will answer based on them.</p></div>`;
}
function add(role, body, extra=''){
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  m.innerHTML = role==='user'
    ? `${extra}${body?`<div class="text">${body}</div><div class="mact uact"><button data-act="copyu" aria-label="Copy" title="Copy">${ICON.copy}</button></div>`:''}`
    : `<div class="avatar">m</div><div class="text">${body}</div>`;
  thread.appendChild(m); feed.scrollTop = feed.scrollHeight; return m;
}

let currentId = null;
async function refreshList(){
  let convs = [];
  try{ const r = await fetch('/conversations'); if(r.ok) convs = await r.json(); }catch(e){}
  const ul = $('hist'); ul.innerHTML = '';
  convs.forEach(c => {
    const li = document.createElement('li'), b = document.createElement('button'), d = document.createElement('button');
    b.textContent = c.title; b.title = c.title; if(c.id === currentId) b.className = 'on';
    b.onclick = () => openChat(c.id);
    d.className = 'del'; d.textContent = '\u00d7'; d.setAttribute('aria-label', 'Delete chat');
    d.onclick = e => { e.stopPropagation(); delChat(c.id); };
    li.append(b, d); ul.appendChild(li);
  });
}
async function openChat(id){
  if(busy) return; stopSpeech();
  const r = await fetch('/conversations/' + id); if(!r.ok) return;
  const rows = await r.json();
  currentId = id; thread.innerHTML = ''; files = []; renderTray(); sync();
  rows.forEach(renderRow);
  feed.scrollTop = feed.scrollHeight; refreshList();
}
async function delChat(id){
  if(!confirm('Delete this chat?')) return;
  await fetch('/conversations/' + id, {method:'DELETE'});
  if(id === currentId) newChat(); else refreshList();
}
function newChat(){ if(busy) return; stopSpeech(); currentId = null; files = []; renderTray(); sync(); intro(); refreshList(); }

async function askBackend(text, sent){
  const fd = new FormData();
  fd.append('message', text);
  if(currentId) fd.append('conversation_id', currentId);
  sent.forEach(f => fd.append('files', f.file));
  const r = await fetch('/chat', {method:'POST', body: fd});
  if(!r.ok){ let d = ''; try{ d = (await r.json()).detail; }catch(e){} throw new Error(d || ('Server error ' + r.status)); }
  return r.json();
}

function fmt(s){
  const blocks = [];
  s = String(s || '').replace(/```([\w+#-]*)[ \t]*\n?([\s\S]*?)```/g, (m, lang, code) => { blocks.push({lang, code: code.replace(/\n$/, '')}); return '\n@@B' + (blocks.length - 1) + '@@\n'; });
  const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const out = []; let list = null;
  const flush = () => { if(list){ out.push(`<${list.t}>${list.i.join('')}</${list.t}>`); list = null; } };
  for(const line of s.split('\n')){
    const b = line.match(/^@@B(\d+)@@$/);
    if(b){ flush(); const k = blocks[+b[1]]; out.push(`<div class="code"><div class="ch"><span>${esc(k.lang || 'code')}</span><button class="copy">Copy</button></div><pre><code>${esc(k.code)}</code></pre></div>`); continue; }
    const h = line.match(/^#{1,4}\s+(.*)/);
    if(h){ flush(); out.push(`<h4>${inline(h[1])}</h4>`); continue; }
    const m = line.match(/^\s*(?:([-*\u2022])|(\d+)\.)\s+(.*)/);
    if(m){ const t = m[2] ? 'ol' : 'ul'; if(!list || list.t !== t){ flush(); list = {t, i:[]}; } list.i.push(`<li>${inline(m[3])}</li>`); }
    else { flush(); if(line.trim()) out.push(`<p>${inline(line)}</p>`); }
  }
  flush(); return out.join('');
}
thread.addEventListener('click', e => {
  const b = e.target.closest('.copy'); if(!b) return;
  navigator.clipboard.writeText(b.closest('.code').querySelector('code').textContent).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); });
});

function send(){
  const text = input.value.trim();
  if((!text && !files.length) || busy) return;
  if(thread.querySelector('.intro')) thread.innerHTML='';
  if(rec){ rec.onresult = null; rec.stop(); }
  busy = true;
  const sent = files.slice();
  if(imgMode && text) return makeImage(text, sent);
  add('user', text ? `<p>${esc(text)}</p>` : '', sent.length ? `<div class="files">${sent.map(f=>chip(f,false)).join('')}</div>` : '');
  files = []; input.value=''; input.style.height='auto'; renderTray(); sync();
  const wait = add('agent','<span class="typing" aria-label="minimi is typing"><i></i><i></i><i></i></span>');
  askBackend(text, sent).then(d => {
    wait.remove(); currentId = d.conversation_id; refreshList();
    addActions(add('agent', fmt(d.reply) + (d.used_search ? `<p class="meta">Searched the web: ${esc(d.search_query || '')}</p>` : '')), d.reply);
  }).catch(err => {
    wait.remove();
    add('agent', `<p>Sorry, something went wrong.</p><p class="meta">${esc(String(err.message || err))}</p>`);
  }).finally(() => { busy = false; sync(); input.focus(); });
}

let imgMode = false;
const pill = $('imgmode');
function setMode(on){
  imgMode = on; $('tools').hidden = !on; pill.classList.toggle('on', on); pill.setAttribute('aria-pressed', on);
  input.placeholder = on ? 'Describe the image you want to create' : 'Message minimi';
}
pill.onclick = () => { setMode(false); input.focus(); };

const imgUrl = n => '/images/' + n;
const IMG_RE = /^\[\[image:([a-f0-9]{32}\.png)\]\]$/;
function imgCard(url, prompt){
  return `<div class="imgcard"><div class="imgbox"><img src="${url}" alt="${esc(prompt || 'Generated image')}"></div><div class="acts"><button data-a="dl" data-u="${url}">Download</button>${prompt ? `<button data-a="re" data-p="${esc(prompt)}">Regenerate</button>` : ''}</div></div>`;
}
function renderRow(m){
  if(m.role === 'user') return add('user', `<p>${esc(m.content)}</p>`);
  const im = m.content.match(IMG_RE);
  const el = add('agent', im ? imgCard(imgUrl(im[1]), '') : fmt(m.content));
  if(!im) addActions(el, m.content);
  return el;
}
async function makeImage(prompt, sent = []){
  busy = true;
  if(thread.querySelector('.intro')) thread.innerHTML = '';
  add('user', `<p>${esc(prompt)}</p>`, sent.length ? `<div class="files">${sent.map(f => chip(f, false)).join('')}</div>` : '');
  files = []; input.value = ''; input.style.height = 'auto'; renderTray(); setMode(false); sync();
  const m = add('agent', '<div class="imgcard"><div class="imgbox load"></div><small style="color:var(--muted)">Creating your image\u2026</small></div>');
  try{
    const r = await fetch('/image', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prompt, conversation_id: currentId})});
    if(!r.ok){ let d = ''; try{ d = (await r.json()).detail; }catch(e){} throw new Error(d || ('Server error ' + r.status)); }
    const d = await r.json();
    currentId = d.conversation_id; refreshList();
    m.querySelector('.text').innerHTML = '<p>Here is the image you requested.</p>' + imgCard(imgUrl(d.image), prompt);
  }catch(err){
    m.querySelector('.text').innerHTML = `<p>Sorry, the image could not be created.</p><p class="meta">${esc(String(err.message || err))}</p>`;
  }
  busy = false; sync(); feed.scrollTop = feed.scrollHeight; input.focus();
}
thread.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  if(b.dataset.a === 'dl'){ const a = document.createElement('a'); a.href = b.dataset.u; a.download = 'minimi-image.png'; a.click(); }
  else if(b.dataset.a === 're' && !busy) makeImage(b.dataset.p);
});

sendBtn.onclick = send;
const menu = $('menu'), att = $('attach');
const closeMenu = () => { menu.hidden = true; att.setAttribute('aria-expanded', 'false'); };
att.onclick = e => { e.stopPropagation(); const open = menu.hidden; menu.hidden = !open; att.setAttribute('aria-expanded', open); };
$('m-files').onclick = () => { closeMenu(); fileIn.click(); };
$('m-img').onclick = () => { closeMenu(); setMode(true); input.focus(); };
document.addEventListener('click', e => { if(!menu.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(); });
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value=''; };
input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
input.addEventListener('input', () => { input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,160)+'px'; sync(); });
input.addEventListener('paste', e => { const f=[...e.clipboardData.files]; if(f.length){ e.preventDefault(); addFiles(f); } });

const drop=$('drop'), comp=$('composer');
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); comp.classList.add('drag'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); comp.classList.remove('drag'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

$('new').onclick = newChat;
const root=document.documentElement, reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!root.dataset.theme) root.dataset.theme = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
$('theme').onclick = e => {
  const next = root.dataset.theme==='dark' ? 'light' : 'dark';
  const flip = () => { root.dataset.theme = next; };
  if(reduce){ flip(); return; }
  if(!document.startViewTransition){ root.classList.add('fade'); flip(); setTimeout(()=>root.classList.remove('fade'),450); return; }
  const r = $('theme').getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
  const rad = Math.hypot(Math.max(x,innerWidth-x), Math.max(y,innerHeight-y));
  document.startViewTransition(flip).ready.then(() => root.animate(
    {clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},
    {duration:650,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'}));
};
$('toggle').onclick = () => {
  const app=document.querySelector('.app'), mobile=matchMedia('(max-width:760px)').matches;
  const open = mobile ? app.classList.toggle('mopen') : !app.classList.toggle('collapsed');
  $('toggle').setAttribute('aria-expanded', open);
};
document.querySelector('.side').addEventListener('click', e => { if(e.target.closest('button') && matchMedia('(max-width:760px)').matches) document.querySelector('.app').classList.remove('mopen'); });
function addActions(m, raw){
  const bar = document.createElement('div'); bar._raw = raw; bar.className = 'mact';
  bar.innerHTML = `<button data-act="copy" aria-label="Copy" title="Copy">${ICON.copy}</button><button data-act="speak" aria-label="Read aloud" title="Read aloud">${ICON.speak}</button>`;
  m.querySelector('.text').appendChild(bar);
}
const speakable = raw => raw.replace(/```[\s\S]*?```/g, ' (code omitted) ').replace(/[*#`_>]/g, '').replace(/\s+/g, ' ').trim();
let speakingBtn = null;
function setSpeaking(btn){
  if(speakingBtn){ speakingBtn.innerHTML = ICON.speak; speakingBtn.setAttribute('aria-label', 'Read aloud'); speakingBtn.title = 'Read aloud'; }
  speakingBtn = btn;
  if(btn){ btn.innerHTML = ICON.stop; btn.setAttribute('aria-label', 'Stop reading'); btn.title = 'Stop reading'; }
}
function stopSpeech(){ if('speechSynthesis' in window) speechSynthesis.cancel(); setSpeaking(null); }
function speak(text, btn){
  if(!('speechSynthesis' in window) || !text) return;
  const same = speakingBtn === btn;
  speechSynthesis.cancel(); setSpeaking(null);
  if(same) return;
  setSpeaking(btn);
  const parts = (text.match(/[^.!?\n]+[.!?]*\s*/g) || [text]).filter(p => p.trim());
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    u.lang = navigator.language || 'en-US';
    if(i === parts.length - 1) u.onend = u.onerror = () => { if(speakingBtn === btn) setSpeaking(null); };
    speechSynthesis.speak(u);
  });
}
thread.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act === 'speak') return speak(speakable(b.closest('.mact')._raw), b);
  const txt = act === 'copy' ? b.closest('.mact')._raw : b.closest('.msg').querySelector('.text').textContent;
  navigator.clipboard.writeText(txt).then(() => { b.innerHTML = ICON.check; setTimeout(() => b.innerHTML = ICON.copy, 1500); });
});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('mic'); let rec = null, base = '';
if(!SR) mic.hidden = true;
mic.onclick = () => {
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = true; rec.continuous = true;
  base = input.value ? input.value.trimEnd() + ' ' : '';
  rec.onresult = e => { let t = ''; for(let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; input.value = base + t; input.dispatchEvent(new Event('input')); };
  rec.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed') alert('Microphone access is blocked. Allow it from the icon in the browser address bar.'); };
  rec.onend = () => { rec = null; mic.classList.remove('rec'); mic.setAttribute('aria-label', 'Voice input'); };
  rec.start(); mic.classList.add('rec'); mic.setAttribute('aria-label', 'Stop voice input');
};

intro();
refreshList();
</script>
